# === nginx: inmobitwo — inmobitwo.seventwo.tech (Next.js web-inmobitwo) ===
# App Node standalone en contenedor: 127.0.0.1:3000 (NO es estático: las rutas
# dinámicas + useSearchParams exigen server). Gestionado por web-inmobitwo.
# Certificado independiente: /etc/letsencrypt/live/inmobitwo.seventwo.tech/
# (se reutiliza el ya existente del Vite; no se regenera).

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name inmobitwo.seventwo.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name inmobitwo.seventwo.tech;

    ssl_certificate /etc/letsencrypt/live/inmobitwo.seventwo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inmobitwo.seventwo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets Next (/_next/static) con hash: caché agresiva
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- WebSocket socket-core (VPS 127.0.0.1:3005) ---
    location /ws {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
